# ForgeOS — picom (compositor ligero, sombras y transparencia suaves)
backend = "glx";
vsync = true;
shadow = true;
shadow-radius = 8;
shadow-offset-x = -4;
shadow-offset-y = -4;
shadow-opacity = 0.5;
corner-radius = 8;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
inactive-opacity = 0.95;
active-opacity = 1.0;
